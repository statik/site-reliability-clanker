<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Caption frame for the explainer video</title>
  <link rel="stylesheet" href="../css/site.css">
  <style>
    /* video/record.mjs fills #caption and takes a 1920 x 1080 picture with no background. */
    html, body { width: 1920px; height: 1080px; margin: 0; background: transparent; }
    body { display: flex; align-items: flex-end; justify-content: center; }
    #caption {
      max-width: 1500px; margin-bottom: 64px; padding: 14px 32px;
      background: color-mix(in srgb, var(--dark) 94%, transparent); color: var(--cream);
      border-left: 6px solid var(--honey);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--cream) 30%, var(--dark));
      font-family: var(--font-sans); font-size: 42px; line-height: 1.3; text-align: center;
      text-wrap: balance;
    }
  </style>
</head>
<body>
  <p id="caption"></p>
</body>
</html>
