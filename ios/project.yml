name: PaperboatManager
options:
  bundleIdPrefix: dev.clanker
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PaperboatManager:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Paperboat
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: >-
          Paperboat Manager talks to the Clanker control plane and to Paperboat on your
          local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.clanker.paperboat-manager
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  PaperboatManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: PaperboatManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.clanker.paperboat-manager.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PaperboatManager:
    build:
      targets:
        PaperboatManager: all
        PaperboatManagerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PaperboatManagerTests
