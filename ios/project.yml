name: SRC
options:
  bundleIdPrefix: dev.clanker
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SRC:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: S.R.C.
        CFBundleName: S.R.C.
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: >-
          S.R.C. talks to its control plane and to Paperboat on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.clanker.src
        # The Keychain refuses an app without a signature (status -34018). A signature
        # "to run locally" needs no development team and is enough in the simulator.
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  SRCTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: SRC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.clanker.src.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SRC:
    build:
      targets:
        SRC: all
        SRCTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SRCTests
