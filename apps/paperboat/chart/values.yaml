# The values interface is platform/CONTRACT.md section 4, plus adminToken.

image:
  # Registry host and path prefix. The image is <registry>/paperboat:<tag>.
  registry: localhost:5001
  # Paperboat release to run: 1.0.0, 1.1.0, 1.1.1 or 1.2.0-bad.
  tag: "1.0.0"

api:
  replicas: 2

worker:
  replicas: 1

web:
  replicas: 2

loadgen:
  # Run synthetic customers against web.
  enabled: false

database:
  # Existing secret in the release namespace with the key DATABASE_URL.
  secretName: paperboat-db

sharedVolume:
  # Existing ReadWriteMany claim in the release namespace. api and worker mount it at /data.
  claimName: paperboat-shared

# Bearer token for POST /api/admin/fault. Empty turns fault injection off.
adminToken: ""
