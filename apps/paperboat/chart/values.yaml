# The values interface is platform/CONTRACT.md section 4: the values of the platform, and
# the settings of the manifest (api.replicas, worker.replicas, web.replicas,
# loadgen.enabled).

api:
  replicas: 2

worker:
  replicas: 1

web:
  replicas: 2

loadgen:
  # Run synthetic customers against web.
  enabled: false

# Layer 50-app sets every value of the platform. These defaults only make the chart render
# alone.
platform:
  name: paperboat
  namespace: paperboat
  # Paperboat release to run: 1.0.0, 1.1.0, 1.1.1 or 1.2.0-bad. The image is
  # <imageRegistry>/paperboat:<version>.
  version: "1.0.0"
  url: http://localhost:8088
  hostname: ""
  imageRegistry: localhost:5001
  # Existing secret in the release namespace with the key DATABASE_URL.
  databaseSecret: paperboat-db
  # Existing ReadWriteMany claim in the release namespace. api and worker mount it at /data.
  sharedVolumeClaim: paperboat-shared
  generatedSecret: ""
  # Bearer token for POST /api/admin/fault. Empty turns fault injection off.
  adminToken: ""
