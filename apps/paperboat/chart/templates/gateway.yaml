{{- if .Values.gateway.className }}
{{- $ctx := dict "root" . "component" "web" -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: paperboat
  labels:
    {{- include "paperboat.labels" $ctx | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperboat
  labels:
    {{- include "paperboat.labels" $ctx | nindent 4 }}
spec:
  parentRefs:
    - name: paperboat
  rules:
    - backendRefs:
        - name: paperboat-web
          port: 8080
{{- end }}
