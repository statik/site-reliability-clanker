{{- $ctx := dict "root" . "component" "web" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperboat-web
  labels:
    {{- include "paperboat.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  {{- include "paperboat.strategy" . | nindent 2 }}
  selector:
    matchLabels:
      {{- include "paperboat.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "paperboat.labels" $ctx | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 15
      {{- include "paperboat.podSecurity" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "paperboat.image" . }}
          args: ["web"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_URL
              value: http://paperboat-api:8081
          {{- include "paperboat.probes" "http" | nindent 10 }}
          {{- include "paperboat.resources" . | nindent 10 }}
          {{- include "paperboat.containerSecurity" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: paperboat-web
  labels:
    {{- include "paperboat.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "paperboat.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
