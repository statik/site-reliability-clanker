{{- $ctx := dict "root" . "component" "migrate" -}}
# Runs before the new pods start. It needs only the database secret, which the platform
# layer creates before this chart is installed.
apiVersion: batch/v1
kind: Job
metadata:
  name: paperboat-migrate
  labels:
    {{- include "paperboat.labels" $ctx | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "paperboat.labels" $ctx | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- include "paperboat.podSecurity" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "paperboat.image" . }}
          args: ["migrate"]
          env:
            {{- include "paperboat.databaseEnv" . | nindent 12 }}
          {{- include "paperboat.resources" . | nindent 10 }}
          {{- include "paperboat.containerSecurity" . | nindent 10 }}
