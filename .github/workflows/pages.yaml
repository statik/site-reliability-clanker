name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yaml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check that the pages are up to date with the data
        working-directory: site
        run: node build.mjs --check
      - name: Collect the files of the site
        run: |
          set -euo pipefail
          mkdir -p _site/out
          cp site/*.html _site/
          cp -R site/css site/js site/fonts site/img site/screens _site/
          touch _site/.nojekyll
      # The video is too large for the repository. It is an asset of the release `site-video`.
      - name: Get the explainer video
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release download site-video --repo "$REPO" --pattern explainer.mp4 --dir _site/out
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
