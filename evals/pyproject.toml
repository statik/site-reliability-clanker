[project]
name = "clanker-evals"
version = "0.1.0"
description = "Inspect AI evaluation suite for the agent roles of Site Reliability Clanker"
requires-python = "==3.13.*"
dependencies = [
    "inspect-ai==0.3.290",
    "openai==3.51.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "D", "SIM", "C90", "PL", "RUF", "TID"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 60

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004"]

[tool.ty.rules]
possibly-unresolved-reference = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
