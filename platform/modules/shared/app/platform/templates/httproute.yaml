apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  {{- with .Values.route.hostnames }}
  hostnames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ .Values.route.service }}
          port: {{ .Values.route.port }}
      {{- with .Values.route.paths }}
      matches:
        {{- range . }}
        - path:
            type: PathPrefix
            value: {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.route.timeout }}
      timeouts:
        request: {{ . | quote }}
      {{- end }}
